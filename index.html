
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="robots" content="noindex, nofollow">

    <meta name="theme-color" content="#071329">

    <title>FinWork 99BD</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #071329;
        }

        #app {
            width: 100%;
            height: 100%;
            height: 100dvh;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #f2f5fa;
        }

        #loading {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: #071329;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: Arial, sans-serif;
        }

        .dots {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .dots span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #1685ff;
            animation: pulse 1s infinite;
        }

        .dots span:nth-child(2) {
            animation-delay: .2s;
        }

        .dots span:nth-child(3) {
            animation-delay: .4s;
        }

        @keyframes pulse {
            50% {
                transform: scale(1.5);
                opacity: .5;
            }
        }

        #loading p {
            font-size: 12px;
            color: #9db9e5;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<div id="app">

    <div id="loading">
        <div class="dots">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <h2>FINWORK 99BD</h2>
        <p>Loading your platform...</p>
    </div>

    <iframe
        id="mainFrame"
        src="/system-data/main.html"
        title="FinWork 99BD">
    </iframe>

</div>

<script>
    const frame = document.getElementById("mainFrame");
    const loading = document.getElementById("loading");

    frame.addEventListener("load", function() {
        loading.style.display = "none";
    });

    // Disable right-click on the outer page
    document.addEventListener("contextmenu", function(e) {
        e.preventDefault();
    });

    // Block common source/save shortcuts on the outer page
    document.addEventListener("keydown", function(e) {
        const key = e.key.toLowerCase();

        if (
            e.key === "F12" ||
            (e.ctrlKey && e.shiftKey &&
                ["i", "j", "c"].includes(key)) ||
            (e.ctrlKey && ["u", "s"].includes(key))
        ) {
            e.preventDefault();
        }
    });
</script>

</body>
</html>
