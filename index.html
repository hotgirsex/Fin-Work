
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#071329">
    <meta name="robots" content="noindex, nofollow">

    <title>FINWORK</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #071329;
        }

        #app {
            width: 100%;
            height: 100%;
            height: 100dvh;
        }

        #mainFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #f2f5fa;
        }

        #loading {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: #071329;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: Arial, sans-serif;
        }

        .dots {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .dots span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #1685ff;
            animation: pulse 1s infinite;
        }

        .dots span:nth-child(2) {
            animation-delay: .2s;
        }

        .dots span:nth-child(3) {
            animation-delay: .4s;
        }

        @keyframes pulse {
            50% {
                transform: scale(1.5);
                opacity: .5;
            }
        }

        #loading p {
            font-size: 12px;
            color: #9db9e5;
            margin-top: 8px;
        }

        #error {
            display: none;
            color: #ffb7b7;
            font-size: 13px;
            margin-top: 15px;
            text-align: center;
            padding: 0 20px;
        }
    </style>
</head>

<body>

<div id="app">

    <div id="loading">

        <div class="dots">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <h2>FINWORK</h2>

        <p>Loading your platform...</p>

        <div id="error">
            Website load করা যাচ্ছে না।
            অনুগ্রহ করে পেজটি Refresh করুন।
        </div>

    </div>

    <iframe
        id="mainFrame"
        title="FINWORK">
    </iframe>

</div>

<script>
(function () {
    "use strict";

    const frame = document.getElementById("mainFrame");
    const loading = document.getElementById("loading");
    const error = document.getElementById("error");

    // Main HTML file location
    const pagePath = atob(
        "L3N5c3RlbS1kYXRhL21haW4uaHRtbA=="
    );

    // Hide loading screen when iframe loads
    frame.addEventListener("load", function () {
        loading.style.display = "none";
    });

    // Show error if iframe reports a loading error
    frame.addEventListener("error", function () {
        error.style.display = "block";

        const dots = loading.querySelector(".dots");

        if (dots) {
            dots.style.display = "none";
        }
    });

    // Load main website
    frame.src = pagePath;

    // Disable right-click menu
    document.addEventListener("contextmenu", function (e) {
        e.preventDefault();
    });

    // Disable selected browser shortcuts
    document.addEventListener("keydown", function (e) {
        const key = e.key.toLowerCase();

        if (
            e.key === "F12" ||
            (e.ctrlKey && e.shiftKey &&
                ["i", "j", "c"].includes(key)) ||
            (e.ctrlKey && ["u", "s"].includes(key))
        ) {
            e.preventDefault();
        }
    });

})();
</script>

</body>
</html>
