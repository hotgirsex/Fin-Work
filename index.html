
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinWork 99BD</title>

    <meta name="robots" content="noindex, nofollow">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            height: 100dvh;
            border: none;
            display: block;
        }
    </style>
</head>

<body>

    <iframe
        src="/system-data/main.html"
        title="FinWork 99BD">
    </iframe>

    <script>
        // Right-click বন্ধ
        document.addEventListener("contextmenu", function(e) {
            e.preventDefault();
        });

        // কিছু Developer Tools shortcut বন্ধ
        document.addEventListener("keydown", function(e) {
            if (
                e.key === "F12" ||
                (e.ctrlKey && e.shiftKey &&
                 ["I", "J", "C"].includes(e.key.toUpperCase()))
            ) {
                e.preventDefault();
            }
        });
    </script>

</body>
</html>
